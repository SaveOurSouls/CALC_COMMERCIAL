<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 Arial, sans-serif; margin: 0; padding: 12px; color: #222; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    select, input, button { width: 100%; box-sizing: border-box; padding: 6px 8px; }
    button { margin-top: 8px; cursor: pointer; border-radius: 4px; }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: #1a73e8; color: #fff; border: none; }
    button.queue { background: #137333; color: #fff; border: none; font-weight: 600; }
    button.queue:disabled { background: #81c995; color: #fff; }
    button.secondary { background: #f1f3f4; border: 1px solid #dadce0; color: #202124; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr 64px; gap: 6px; }
    #ops { height: 120px; }
    .badge {
      display: inline-block; background: #e8f0fe; color: #1967d2;
      padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin: 8px 0;
    }
    .hint { color: #5f6368; font-size: 11px; margin-top: 6px; line-height: 1.45; }
    .section-title { font-size: 13px; margin: 14px 0 6px; font-weight: 600; color: #3c4043; }
    hr.sep { border: none; border-top: 1px solid #dadce0; margin: 12px 0; }
    button.semifinished { background: #e8710a; color: #fff; border: none; font-weight: 600; }
    #status { margin-top: 10px; font-size: 11px; color: #137333; min-height: 16px; }
    .err { color: #c5221f; }
  </style>
</head>
<body>
  <h2>Справочник</h2>
  <p class="hint">Добавляйте операции в очередь — <strong>+ В очередь</strong> работает всегда. Список смотрите в плавающем окне.</p>

  <div class="badge" id="queueBadge">В очереди: 0</div>

  <label>Лист КБ</label>
  <select id="sheet"></select>

  <label>Эскиз проекта</label>
  <select id="sketch"></select>

  <label>Операция</label>
  <input type="search" id="search" placeholder="Поиск по номеру…">
  <select id="ops" size="8"></select>

  <div class="row2">
    <div><label>N</label><input type="number" id="n" value="1" min="0" step="any"></div>
    <div><label>L</label><input type="number" id="l" value="0" min="0" step="any"></div>
    <div><label>×</label><input type="number" id="addCount" value="1" min="1" max="20"></div>
  </div>

  <label>OP</label>
  <input type="text" id="op" placeholder="необязательно">

  <button class="primary" id="btnAdd">+ В очередь</button>

  <hr class="sep">
  <div class="section-title">Полуфабрикат</div>
  <p class="hint">Готовый набор операций из окна «Очередь» (лист КБ.ПРЕСЕТЫ).</p>

  <label>Тип полуфабриката</label>
  <select id="semifinishedGroup"></select>

  <label>Название полуфабриката</label>
  <select id="semifinishedArticle"></select>

  <button class="semifinished" id="btnAddSemifinished">+ Полуфабрикат в очередь</button>
  <button type="button" class="secondary" id="btnRefreshPresets">↻ Обновить список полуфабрикатов</button>

  <button class="queue" id="btnOpenQueue">▣ Открыть очередь</button>

  <div id="status"></div>

  <script>
    var state = { opsBySketch: {}, operations: [], presets: { groups: [], byGroup: {} } };

    function setStatus(msg, isErr) {
      var el = document.getElementById('status');
      el.textContent = msg || '';
      el.className = isErr ? 'err' : '';
    }

    function updateOpenQueueButton() {
      google.script.run
        .withSuccessHandler(function (r) {
          var btn = document.getElementById('btnOpenQueue');
          btn.disabled = !!r.open;
          btn.textContent = r.open ? 'Очередь уже открыта' : '▣ Открыть очередь';
        })
        .apiIsQueueDialogOpen();
    }

    function refreshBadge() {
      google.script.run
        .withSuccessHandler(function (data) {
          document.getElementById('queueBadge').textContent = 'В очереди: ' + (data.count || 0);
        })
        .apiGetQueueCount();
    }

    function refreshPresetsFromServer_() {
      google.script.run
        .withSuccessHandler(function (idx) {
          state.presets = idx || { groups: [], byGroup: {} };
          fillSemifinishedSelects_();
        })
        .withFailureHandler(function () { /* пресеты опциональны */ })
        .apiGetSemifinishedPresetsIndex();
    }

    function fillSelect(id, items, getVal, getLabel, ph) {
      var sel = document.getElementById(id);
      sel.innerHTML = '';
      if (!items || !items.length) {
        var o = document.createElement('option');
        o.textContent = ph || '—';
        sel.appendChild(o);
        return;
      }
      items.forEach(function (item) {
        var o = document.createElement('option');
        o.value = getVal(item);
        o.textContent = getLabel(item);
        sel.appendChild(o);
      });
    }

    function fillSemifinishedSelects_() {
      var presets = state.presets || { groups: [], byGroup: {} };
      fillSelect('semifinishedGroup', presets.groups, function (g) { return g; }, function (g) { return g; }, 'Нет наборов');
      var groupSel = document.getElementById('semifinishedGroup');
      if (presets.groups && presets.groups.length && !groupSel.value) {
        groupSel.selectedIndex = 0;
      }
      var group = groupSel.value;
      var articles = presets.byGroup[group] || [];
      fillSelect('semifinishedArticle', articles, function (a) { return a; }, function (a) { return a; }, '—');
    }

    function addSemifinishedToQueue() {
      var group = document.getElementById('semifinishedGroup').value;
      var article = document.getElementById('semifinishedArticle').value;
      if (!group || !article) {
        setStatus('Выберите тип и название полуфабриката', true);
        return;
      }
      setStatus('Загрузка набора…');
      google.script.run
        .withSuccessHandler(function (res) {
          document.getElementById('queueBadge').textContent = 'В очереди: ' + res.count;
          setStatus(res.hint || ('Добавлено ' + res.added));
          updateOpenQueueButton();
        })
        .withFailureHandler(function (e) { setStatus(e.message, true); })
        .apiAppendSemifinishedToQueue({
          group: group,
          article: article,
          sheetName: document.getElementById('sheet').value
        });
    }

    function loadOperations() {
      var sketch = document.getElementById('sketch').value;
      state.operations = state.opsBySketch[sketch] || [];
      var q = document.getElementById('search').value.trim().toLowerCase();
      var sel = document.getElementById('ops');
      sel.innerHTML = '';
      state.operations.filter(function (op) {
        return !q || String(op.number).toLowerCase().indexOf(q) >= 0;
      }).forEach(function (op) {
        var o = document.createElement('option');
        o.value = op.number;
        o.textContent = op.label;
        sel.appendChild(o);
      });
    }

    function addToQueue() {
      var sketch = document.getElementById('sketch').value;
      var number = document.getElementById('ops').value;
      if (!sketch || !number) {
        setStatus('Выберите эскиз и операцию', true);
        return;
      }
      var op = state.operations.find(function (o) { return o.number === number; }) || {};
      var times = parseInt(document.getElementById('addCount').value, 10) || 1;
      times = Math.min(Math.max(times, 1), 20);
      var n = Number(document.getElementById('n').value);
      var l = Number(document.getElementById('l').value);
      var opText = document.getElementById('op').value;
      var items = [];
      for (var i = 0; i < times; i++) {
        items.push({
          sketch: sketch,
          number: number,
          label: op.label || number,
          opType: op.opType || '',
          n: n,
          l: l,
          op: opText
        });
      }

      setStatus('Добавление…');
      google.script.run
        .withSuccessHandler(function (res) {
          document.getElementById('queueBadge').textContent = 'В очереди: ' + res.count;
          setStatus('Добавлено. В очереди: ' + res.count);
          updateOpenQueueButton();
        })
        .withFailureHandler(function (e) { setStatus(e.message, true); })
        .apiAppendToQueue({
          sheetName: document.getElementById('sheet').value,
          items: items
        });
    }

    function init() {
      setStatus('Загрузка…');
      google.script.run
        .withSuccessHandler(function () {
          google.script.run
            .withSuccessHandler(function (data) {
              setStatus('');
              state.opsBySketch = data.opsBySketch || {};
              state.presets = data.presets || { groups: [], byGroup: {} };
              fillSelect('sheet', data.sheets, function (s) { return s; }, function (s) { return s; }, 'Нет КБ');
              fillSemifinishedSelects_();
              fillSelect('sketch', data.sketches, function (s) { return s; }, function (s) { return s; }, 'Нет эскизов');
              if (data.activeSheet && data.sheets && data.sheets.indexOf(data.activeSheet) >= 0) {
                document.getElementById('sheet').value = data.activeSheet;
              }
              if (data.sketches && data.sketches.length) {
                document.getElementById('sketch').selectedIndex = 0;
                loadOperations();
              }
              document.getElementById('queueBadge').textContent = 'В очереди: ' + (data.queueCount || 0);
              enableOpenQueueButton_();
            })
            .withFailureHandler(function (e) { setStatus(e.message, true); })
            .apiGetInitialData();
        })
        .apiSidebarReady();
    }

    function enableOpenQueueButton_() {
      var btn = document.getElementById('btnOpenQueue');
      btn.disabled = false;
      btn.textContent = '▣ Открыть очередь';
    }

    document.getElementById('sketch').onchange = loadOperations;
    document.getElementById('search').oninput = loadOperations;
    document.getElementById('semifinishedGroup').onchange = fillSemifinishedSelects_;
    document.getElementById('btnAdd').onclick = addToQueue;
    document.getElementById('btnAddSemifinished').onclick = addSemifinishedToQueue;
    document.getElementById('btnRefreshPresets').onclick = function () {
      setStatus('Обновление…');
      google.script.run
        .withSuccessHandler(function (idx) {
          state.presets = idx || { groups: [], byGroup: {} };
          fillSemifinishedSelects_();
          var n = (idx && idx.groups) ? idx.groups.length : 0;
          setStatus(n ? ('Загружено групп: ' + n) : 'Нет сохранённых наборов (сначала «Записать» в очереди)');
        })
        .withFailureHandler(function (e) { setStatus(e.message, true); })
        .apiGetSemifinishedPresetsIndex();
    };
    document.getElementById('btnOpenQueue').onclick = function () {
      if (document.getElementById('btnOpenQueue').disabled) return;
      setStatus('Открываю…');
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.alreadyOpen) {
            setStatus('Окно уже открыто');
          } else {
            setStatus('Окно открыто');
          }
          updateOpenQueueButton();
        })
        .withFailureHandler(function (e) { setStatus(e.message, true); })
        .showKbQueueDialog();
    };

    init();
    setInterval(updateOpenQueueButton, 4000);
    setInterval(refreshBadge, 8000);
    setInterval(refreshPresetsFromServer_, 12000);
  </script>
</body>
</html>
