<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 Arial, sans-serif; margin: 0; padding: 12px; color: #222; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    select, input, button { width: 100%; box-sizing: border-box; padding: 6px 8px; }
    button { margin-top: 8px; cursor: pointer; }
    button.primary { background: #1a73e8; color: #fff; border: none; border-radius: 4px; }
    button.secondary { background: #f1f3f4; border: 1px solid #dadce0; border-radius: 4px; }
    #ops { height: 220px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hint { color: #5f6368; font-size: 11px; margin-top: 4px; }
    #status { margin-top: 10px; min-height: 18px; color: #137333; }
    .err { color: #c5221f; }
  </style>
</head>
<body>
  <h2>Быстрый набор операций</h2>

  <label>Лист КБ</label>
  <select id="sheet"></select>

  <label>Эскиз проекта</label>
  <select id="sketch"></select>

  <label>Операция (Номер)</label>
  <input type="search" id="search" placeholder="Поиск по номеру…">
  <select id="ops" size="12"></select>

  <div class="row2">
    <div>
      <label>N</label>
      <input type="number" id="n" value="1" min="0" step="any">
    </div>
    <div>
      <label>L</label>
      <input type="number" id="l" value="0" min="0" step="any">
    </div>
  </div>

  <label>OP (необязательно)</label>
  <input type="text" id="op" placeholder="">

  <label>Количество строк</label>
  <input type="number" id="count" value="1" min="1" max="50" step="1">

  <button class="primary" id="btnInsert">Вставить операцию</button>
  <button class="secondary" id="btnDup">Скопировать последнюю строку</button>
  <p class="hint">Выделите строку в таблице — новые строки встанут <strong>на её место</strong> (старая сдвинется вниз). «Копировать» берёт данные с <strong>выделенной</strong> строки. При количестве &gt; 1 все строки — копии первой вставленной.</p>

  <div id="status"></div>

  <script>
    var state = { operations: [] };

    function setStatus(msg, isErr) {
      var el = document.getElementById('status');
      el.textContent = msg || '';
      el.className = isErr ? 'err' : '';
    }

    function fillSelect(id, items, getVal, getLabel, placeholder) {
      var sel = document.getElementById(id);
      sel.innerHTML = '';
      if (!items || !items.length) {
        var empty = document.createElement('option');
        empty.value = '';
        empty.textContent = placeholder || '— нет данных —';
        sel.appendChild(empty);
        return;
      }
      items.forEach(function (item) {
        var o = document.createElement('option');
        o.value = getVal(item);
        o.textContent = getLabel(item);
        sel.appendChild(o);
      });
    }

    function loadOperations() {
      var sketch = document.getElementById('sketch').value;
      if (!sketch) return;
      setStatus('Загрузка операций…');
      google.script.run
        .withSuccessHandler(function (ops) {
          state.operations = ops || [];
          renderOps();
          setStatus('');
        })
        .withFailureHandler(function (e) { setStatus(e.message, true); })
        .apiGetOperations(sketch);
    }

    function renderOps() {
      var q = document.getElementById('search').value.trim().toLowerCase();
      var filtered = state.operations.filter(function (op) {
        return !q || String(op.number).toLowerCase().indexOf(q) >= 0 ||
          String(op.opType).toLowerCase().indexOf(q) >= 0;
      });
      var sel = document.getElementById('ops');
      sel.innerHTML = '';
      filtered.forEach(function (op) {
        var o = document.createElement('option');
        o.value = op.number;
        o.textContent = op.label;
        sel.appendChild(o);
      });
    }

    function init() {
      google.script.run
        .withSuccessHandler(function (data) {
          if (data.error) {
            setStatus(data.error + (data.hint ? '\n' + data.hint : ''), true);
          } else if (data.hint) {
            setStatus(data.hint, true);
          }
          fillSelect('sheet', data.sheets, function (s) { return s; }, function (s) { return s; },
            'Нет листов КБ1, КБ2…');
          fillSelect('sketch', data.sketches, function (s) { return s; }, function (s) { return s; },
            'Нет эскизов — проверьте БД.ОП');
          var sheetSel = document.getElementById('sheet');
          if (data.activeSheet && data.sheets && data.sheets.indexOf(data.activeSheet) >= 0) {
            sheetSel.value = data.activeSheet;
          }
          if (data.sketches && data.sketches.length) {
            loadOperations();
          }
        })
        .withFailureHandler(function (e) { setStatus(e.message, true); })
        .apiGetInitialData();
    }

    document.getElementById('sketch').addEventListener('change', loadOperations);
    document.getElementById('search').addEventListener('input', renderOps);

    document.getElementById('btnInsert').addEventListener('click', function () {
      var ops = document.getElementById('ops');
      if (!ops.value) {
        setStatus('Выберите операцию', true);
        return;
      }
      var payload = {
        sheetName: document.getElementById('sheet').value,
        sketch: document.getElementById('sketch').value,
        number: ops.value,
        n: Number(document.getElementById('n').value),
        l: Number(document.getElementById('l').value),
        op: document.getElementById('op').value,
        count: Number(document.getElementById('count').value)
      };
      setStatus('Вставка…');
      google.script.run
        .withSuccessHandler(function (res) {
          var msg = 'Добавлено строк: ' + res.rows.length + ' (' + res.sheetName + ')';
          if (res.hint) msg += '. ' + res.hint;
          setStatus(msg);
        })
        .withFailureHandler(function (e) { setStatus(e.message, true); })
        .apiInsertRows(payload);
    });

    document.getElementById('btnDup').addEventListener('click', function () {
      var sheetName = document.getElementById('sheet').value;
      var count = Number(document.getElementById('count').value) || 1;
      setStatus('Копирование…');
      google.script.run
        .withSuccessHandler(function (res) {
          var msg = 'Скопировано строк: ' + res.rows.length;
          if (res.hint) msg += '. ' + res.hint;
          setStatus(msg);
        })
        .withFailureHandler(function (e) { setStatus(e.message, true); })
        .apiDuplicateLast(sheetName, count);
    });

    init();
  </script>
</body>
</html>
