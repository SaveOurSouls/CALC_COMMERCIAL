<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { font: 13px/1.4 Arial, sans-serif; margin: 0; padding: 12px 14px; color: #202124; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .top select { min-width: 140px; padding: 6px 8px; }
    .badge { background: #e8f0fe; color: #1967d2; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
    .hint { color: #5f6368; font-size: 12px; margin: 0 0 10px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    button { padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button.primary { background: #1a73e8; color: #fff; border: none; font-weight: 600; }
    button.secondary { background: #f1f3f4; border: 1px solid #dadce0; }
    button.danger { background: #fff; border: 1px solid #dadce0; color: #c5221f; }
    button:disabled { opacity: .55; cursor: default; }
    .table-wrap {
      height: calc(100vh - 140px); min-height: 720px; max-height: 1120px;
      overflow: auto; border: 1px solid #dadce0; border-radius: 6px; background: #fff;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      position: sticky; top: 0; background: #f8f9fa; z-index: 1;
      text-align: left; padding: 8px 6px; border-bottom: 2px solid #dadce0;
      font-size: 11px; text-transform: uppercase; color: #5f6368;
    }
    td { padding: 6px; border-bottom: 1px solid #eee; vertical-align: middle; }
    tr.drag-over td { background: #e8f0fe; }
    tr.dragging { opacity: .45; }
    td input, td select { width: 100%; padding: 5px 6px; border: 1px solid #dadce0; border-radius: 3px; font-size: 12px; }
    td.col-sketch { min-width: 140px; }
    td.col-number { min-width: 160px; }
    .op-type-hint { display: block; color: #5f6368; font-size: 10px; margin-top: 2px; }
    td.num { width: 36px; text-align: center; color: #5f6368; font-weight: 600; }
    td.handle { width: 28px; text-align: center; cursor: grab; color: #9aa0a6; font-size: 16px; }
    td.act { width: 100px; white-space: nowrap; }
    td.act button { padding: 4px 8px; margin-right: 2px; font-size: 12px; }
    .empty { padding: 40px; text-align: center; color: #5f6368; }
    #status { margin-top: 10px; font-size: 12px; color: #137333; min-height: 18px; }
    .err { color: #c5221f; }
    .saving { color: #5f6368; font-style: italic; }
    #loadingOverlay {
      position: fixed; inset: 0; background: rgba(255,255,255,.85);
      display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 9;
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">Загрузка очереди…</div>

  <h2>Очередь операций</h2>
  <p class="hint">Вставка: только Эскиз, Номер, N, L, OP (без пересчёта). «+ Добавить лист» — копия активного листа в шаблон КБ.ШАБЛ.N с формулами.</p>

  <div class="top">
    <span>Вставить в лист:</span>
    <select id="sheet"></select>
    <span class="badge" id="queueCount">0 поз.</span>
    <button type="button" class="secondary" id="btnRefresh">↻ С сервера</button>
  </div>

  <div class="toolbar">
    <button type="button" class="primary" id="btnInsertAll">Вставить всё в лист</button>
    <button type="button" class="secondary" id="btnAddSheet">+ Добавить лист</button>
    <button type="button" class="danger" id="btnClear">Очистить очередь</button>
  </div>

  <div class="table-wrap">
    <table id="queueTable">
      <thead>
        <tr>
          <th></th><th>#</th><th>Эскиз</th><th>Номер</th><th>N</th><th>L</th><th>OP</th><th></th>
        </tr>
      </thead>
      <tbody id="queueBody"></tbody>
    </table>
    <div class="empty" id="queueEmpty" style="display:none">Очередь пуста. Добавьте операции из боковой панели «Справочник».</div>
  </div>

  <datalist id="dlSketches"></datalist>

  <div id="status"></div>

  <script>
    var state = { queue: [], nextId: 1, dragId: null, dirty: false };
    var catalog = { sketches: [], opsBySketch: {} };
    var saveTimer = null;
    var pingTimer = null;

    function setStatus(msg, isErr, isSaving) {
      var el = document.getElementById('status');
      el.textContent = msg || '';
      el.className = isErr ? 'err' : (isSaving ? 'saving' : '');
    }

    function updateCount_() {
      document.getElementById('queueCount').textContent = state.queue.length + ' поз.';
    }

    function scheduleSave_() {
      state.dirty = true;
      setStatus('Сохранение…', false, true);
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave_, 600);
    }

    function flushSave_(cb) {
      if (!state.dirty && !cb) return;
      google.script.run
        .withSuccessHandler(function (res) {
          state.dirty = false;
          updateCount_();
          setStatus('');
          if (cb) cb();
        })
        .withFailureHandler(function (e) { setStatus(e.message, true); })
        .apiSaveQueue({
          queue: state.queue,
          nextId: state.nextId,
          sheetName: document.getElementById('sheet').value
        });
    }

    function fillSheetSelect(sheets, selected) {
      var sel = document.getElementById('sheet');
      sel.innerHTML = '';
      (sheets || []).forEach(function (s) {
        var o = document.createElement('option');
        o.value = s;
        o.textContent = s;
        sel.appendChild(o);
      });
      if (selected) sel.value = selected;
    }

    function esc_(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    }
    function escAttr_(s) {
      return String(s || '').replace(/"/g, '&quot;');
    }

    function fillSketchesDatalist_() {
      var dl = document.getElementById('dlSketches');
      dl.innerHTML = '';
      catalog.sketches.forEach(function (s) {
        var o = document.createElement('option');
        o.value = s;
        dl.appendChild(o);
      });
    }

    function ensureNumberDatalist_(item) {
      var listId = 'dlNum' + item.id;
      var dl = document.getElementById(listId);
      if (!dl) {
        dl = document.createElement('datalist');
        dl.id = listId;
        document.body.appendChild(dl);
      }
      dl.innerHTML = '';
      var ops = catalog.opsBySketch[item.sketch] || [];
      ops.forEach(function (op) {
        var o = document.createElement('option');
        o.value = op.number;
        if (op.label) {
          o.label = op.label;
        }
        dl.appendChild(o);
      });
      return listId;
    }

    function syncOpMeta_(item, tr) {
      var ops = catalog.opsBySketch[item.sketch] || [];
      var found = null;
      for (var i = 0; i < ops.length; i++) {
        if (ops[i].number === item.number) {
          found = ops[i];
          break;
        }
      }
      if (found) {
        item.label = found.label || found.number;
        item.opType = found.opType || '';
      } else {
        item.label = item.number;
        item.opType = '';
      }
      var hint = tr.querySelector('.op-type-hint');
      if (hint) {
        hint.textContent = item.opType ? item.opType : '—';
      }
    }

    function buildRowEl_(item, index) {
      var tr = document.createElement('tr');
      tr.dataset.id = String(item.id);
      tr.draggable = true;
      var numListId = ensureNumberDatalist_(item);

      tr.innerHTML =
        '<td class="handle" title="Перетащить">☰</td>' +
        '<td class="num">' + (index + 1) + '</td>' +
        '<td class="col-sketch">' +
          '<input type="text" data-f="sketch" value="' + escAttr_(item.sketch) + '" list="dlSketches" placeholder="Эскиз">' +
        '</td>' +
        '<td class="col-number">' +
          '<input type="text" data-f="number" value="' + escAttr_(item.number) + '" list="' + numListId + '" placeholder="Номер">' +
          '<span class="op-type-hint">' + esc_(item.opType || '—') + '</span>' +
        '</td>' +
        '<td><input type="number" data-f="n" value="' + item.n + '" step="any"></td>' +
        '<td><input type="number" data-f="l" value="' + item.l + '" step="any"></td>' +
        '<td><input type="text" data-f="op" value="' + escAttr_(item.op || '') + '"></td>' +
        '<td class="act">' +
          '<button type="button" class="secondary" data-up>↑</button>' +
          '<button type="button" class="secondary" data-down>↓</button>' +
          '<button type="button" class="secondary" data-dup>⧉</button>' +
          '<button type="button" class="danger" data-del>×</button>' +
        '</td>';
      bindRow_(tr, item);
      return tr;
    }

    function renderTable() {
      var tbody = document.getElementById('queueBody');
      var empty = document.getElementById('queueEmpty');
      var table = document.getElementById('queueTable');
      tbody.innerHTML = '';

      if (!state.queue.length) {
        empty.style.display = 'block';
        table.style.display = 'none';
        updateCount_();
        return;
      }
      empty.style.display = 'none';
      table.style.display = 'table';
      var frag = document.createDocumentFragment();
      state.queue.forEach(function (item, index) {
        frag.appendChild(buildRowEl_(item, index));
      });
      tbody.appendChild(frag);
      updateCount_();
    }

    function refreshRowNumbers_() {
      var rows = document.getElementById('queueBody').children;
      for (var i = 0; i < rows.length; i++) {
        rows[i].querySelector('.num').textContent = String(i + 1);
      }
    }

    function rowIndexById_(id) {
      return state.queue.findIndex(function (q) { return q.id === id; });
    }

    function swapDomRows_(i, j) {
      var tbody = document.getElementById('queueBody');
      var a = tbody.children[i];
      var b = tbody.children[j];
      if (!a || !b) return;
      if (i < j) {
        tbody.insertBefore(b, a);
      } else {
        tbody.insertBefore(a, b);
      }
    }

    function bindRow_(tr, item) {
      tr.querySelector('[data-up]').onclick = function () { move_(item.id, -1); };
      tr.querySelector('[data-down]').onclick = function () { move_(item.id, 1); };
      tr.querySelector('[data-dup]').onclick = function () { dup_(item.id); };
      tr.querySelector('[data-del]').onclick = function () { del_(item.id); };

      tr.querySelectorAll('input').forEach(function (inp) {
        inp.oninput = function () {
          var f = inp.getAttribute('data-f');
          if (f === 'sketch') {
            item.sketch = inp.value.trim();
            var numInp = tr.querySelector('input[data-f="number"]');
            var listId = ensureNumberDatalist_(item);
            numInp.setAttribute('list', listId);
            syncOpMeta_(item, tr);
            scheduleSave_();
            return;
          }
          if (f === 'number') {
            item.number = inp.value.trim();
            syncOpMeta_(item, tr);
            scheduleSave_();
            return;
          }
          item[f] = (f === 'n' || f === 'l') ? Number(inp.value) : inp.value;
          scheduleSave_();
        };
        inp.onchange = inp.oninput;
      });

      tr.addEventListener('dragstart', function (e) {
        state.dragId = item.id;
        tr.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      tr.addEventListener('dragend', function () {
        state.dragId = null;
        tr.classList.remove('dragging');
      });
      tr.addEventListener('dragover', function (e) {
        e.preventDefault();
        tr.classList.add('drag-over');
      });
      tr.addEventListener('dragleave', function () { tr.classList.remove('drag-over'); });
      tr.addEventListener('drop', function (e) {
        e.preventDefault();
        tr.classList.remove('drag-over');
        dropOn_(item.id);
      });
    }

    function move_(id, dir) {
      var i = rowIndexById_(id);
      if (i < 0) return;
      var j = i + dir;
      if (j < 0 || j >= state.queue.length) return;
      var t = state.queue[i];
      state.queue[i] = state.queue[j];
      state.queue[j] = t;
      swapDomRows_(i, j);
      refreshRowNumbers_();
      scheduleSave_();
    }

    function dup_(id) {
      var i = rowIndexById_(id);
      if (i < 0) return;
      var c = JSON.parse(JSON.stringify(state.queue[i]));
      c.id = state.nextId++;
      state.queue.splice(i + 1, 0, c);
      var tbody = document.getElementById('queueBody');
      var ref = tbody.children[i + 1] || null;
      tbody.insertBefore(buildRowEl_(c, i + 1), ref);
      refreshRowNumbers_();
      scheduleSave_();
    }

    function del_(id) {
      var i = rowIndexById_(id);
      if (i < 0) return;
      state.queue.splice(i, 1);
      var tbody = document.getElementById('queueBody');
      if (tbody.children[i]) tbody.removeChild(tbody.children[i]);
      if (!state.queue.length) {
        document.getElementById('queueEmpty').style.display = 'block';
        document.getElementById('queueTable').style.display = 'none';
      }
      refreshRowNumbers_();
      updateCount_();
      scheduleSave_();
    }

    function dropOn_(targetId) {
      if (state.dragId === null || state.dragId === targetId) return;
      var from = rowIndexById_(state.dragId);
      var to = rowIndexById_(targetId);
      if (from < 0 || to < 0) return;
      var m = state.queue.splice(from, 1)[0];
      state.queue.splice(to, 0, m);
      renderTable();
      scheduleSave_();
    }

    function bootstrap() {
      google.script.run
        .withSuccessHandler(function (data) {
          document.getElementById('loadingOverlay').style.display = 'none';
          state.queue = data.queue || [];
          state.nextId = data.nextId || 1;
          catalog.sketches = data.sketches || [];
          catalog.opsBySketch = data.opsBySketch || {};
          fillSketchesDatalist_();
          fillSheetSelect(data.sheets, data.sheetName);
          renderTable();
        })
        .withFailureHandler(function (e) {
          document.getElementById('loadingOverlay').style.display = 'none';
          setStatus(e.message, true);
        })
        .apiQueueDialogBootstrap();
    }

    function startPing_() {
      google.script.run.apiQueueDialogPing();
      pingTimer = setInterval(function () {
        google.script.run.apiQueueDialogPing();
      }, 5000);
    }

    function insertAll() {
      flushSave_(function () {
        if (!state.queue.length) {
          setStatus('Очередь пуста', true);
          return;
        }
        var sheetName = document.getElementById('sheet').value;
        setStatus('Вставка ' + state.queue.length + ' строк…');
        document.getElementById('btnInsertAll').disabled = true;
        var rows = state.queue.map(function (item) {
          return { sketch: item.sketch, number: item.number, n: item.n, l: item.l, op: item.op || '' };
        });
        google.script.run
          .withSuccessHandler(function (res) {
            document.getElementById('btnInsertAll').disabled = false;
            setStatus(res.hint || 'Готово');
          })
          .withFailureHandler(function (e) {
            document.getElementById('btnInsertAll').disabled = false;
            setStatus(e.message, true);
          })
          .apiInsertQueue({ sheetName: sheetName, rows: rows });
      });
    }

    document.getElementById('sheet').onchange = scheduleSave_;
    function addSheetTemplate() {
      setStatus('Копирование листа в шаблон…');
      document.getElementById('btnAddSheet').disabled = true;
      google.script.run
        .withSuccessHandler(function (res) {
          document.getElementById('btnAddSheet').disabled = false;
          setStatus(res.hint || ('Создан «' + res.sheetName + '»'));
        })
        .withFailureHandler(function (e) {
          document.getElementById('btnAddSheet').disabled = false;
          setStatus(e.message, true);
        })
        .apiAddActiveSheetToKbTemplate();
    }

    document.getElementById('btnInsertAll').onclick = insertAll;
    document.getElementById('btnAddSheet').onclick = addSheetTemplate;
    document.getElementById('btnRefresh').onclick = function () {
      document.getElementById('loadingOverlay').style.display = 'flex';
      bootstrap();
    };
    document.getElementById('btnClear').onclick = function () {
      if (state.queue.length && !confirm('Очистить всю очередь?')) return;
      google.script.run
        .withSuccessHandler(function () {
          state.queue = [];
          state.nextId = 1;
          state.dirty = false;
          renderTable();
          setStatus('');
        })
        .apiClearQueue();
    };

    window.addEventListener('beforeunload', function () {
      if (state.dirty) flushSave_();
      google.script.run.apiQueueDialogClose();
    });

    startPing_();
    bootstrap();
  </script>
</body>
</html>
